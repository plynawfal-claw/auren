<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PROMOSTORE ALU">
  <defs>
    <linearGradient id="sAlu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfdfe"/><stop offset="20%" stop-color="#c9ced3"/>
      <stop offset="42%" stop-color="#82878d"/><stop offset="58%" stop-color="#eef1f3"/>
      <stop offset="78%" stop-color="#90969c"/><stop offset="100%" stop-color="#6f747a"/>
    </linearGradient>
    <linearGradient id="sBeam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8874a"/><stop offset="40%" stop-color="#d9bd83"/>
      <stop offset="58%" stop-color="#fdf4de"/><stop offset="78%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#8d6f37"/>
    </linearGradient>
    <clipPath id="sRing">
      <path fill-rule="evenodd" d="M5 5h54v54H5V5Zm12 12h30v30H17V17Z"/>
    </clipPath>
    <clipPath id="sOpening"><rect x="17" y="17" width="30" height="30"/></clipPath>
  </defs>

  <!-- heavy aluminium frame -->
  <path fill="url(#sAlu)" fill-rule="evenodd" d="M5 5h54v54H5V5Zm12 12h30v30H17V17Z"/>

  <!-- a single ray, raking the frame and crossing the opening -->
  <g clip-path="url(#sRing)">
    <path fill="url(#sBeam)" d="M-6 70 40-12h9L3 70Z"/>
  </g>
  <g clip-path="url(#sOpening)">
    <path fill="url(#sBeam)" fill-opacity=".85" d="M-6 70 40-12h9L3 70Z"/>
  </g>
</svg>
