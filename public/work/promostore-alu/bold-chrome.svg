<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PROMOSTORE ALU">
  <defs>
    <linearGradient id="cPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23262b"/><stop offset="55%" stop-color="#111316"/><stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="cAlu" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="16%" stop-color="#d3d7db"/>
      <stop offset="34%" stop-color="#8b9096"/><stop offset="50%" stop-color="#f4f6f8"/>
      <stop offset="66%" stop-color="#959aa0"/><stop offset="84%" stop-color="#dfe3e6"/>
      <stop offset="100%" stop-color="#767b81"/>
    </linearGradient>
    <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9edcd"/><stop offset="30%" stop-color="#d8bc82"/>
      <stop offset="55%" stop-color="#a8874a"/><stop offset="75%" stop-color="#f2e2bb"/>
      <stop offset="100%" stop-color="#8d6f37"/>
    </linearGradient>
    <linearGradient id="cShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cClip"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#cPlate)"/>
  <!-- P in brushed aluminium, gold thermal break -->
  <g transform="translate(9.6 9) scale(.72)">
    <path fill="url(#cAlu)" fill-rule="evenodd"
      d="M10 6h28a15 15 0 0 1 0 30H22v22H10V6Zm12 10h14a5 5 0 0 1 0 10H22V16Z"/>
    <rect x="10" y="41" width="12" height="6" fill="url(#cGold)"/>
  </g>
  <!-- specular sweep across the plate -->
  <g clip-path="url(#cClip)">
    <path fill="url(#cShine)" d="M-14 46 30-16h20L6 46Z"/>
  </g>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="#c9a96e" stroke-opacity=".28"/>
</svg>
